<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchemaTeX Prototype Tester</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            background: #fff;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .header {
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .pane-header {
            padding: 12px 16px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            background: #fff;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #fafafa;
        }

        .button-group {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        button.primary:hover {
            background: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        button.primary:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        .tabs {
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #555;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .content {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .json-output {
            padding: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f5f5f5;
            color: #333;
        }

        .json-output.dark {
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-banner {
            background: #fee;
            border-bottom: 1px solid #fcc;
            padding: 12px 16px;
            color: #c33;
            font-size: 12px;
            max-height: 60px;
            overflow-y: auto;
        }

        .success-banner {
            background: #efe;
            border-bottom: 1px solid #cfc;
            padding: 12px 16px;
            color: #3c3;
            font-size: 12px;
        }

        .diagram-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .diagram-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
        }

        .diagram-item-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 4px;
        }

        .diagram-item-content {
            font-family: monospace;
            color: #555;
            margin-left: 8px;
        }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .container {
                background: #252526;
            }

            .editor-pane {
                background: #1e1e1e;
                border-right-color: #3e3e42;
            }

            .output-pane {
                background: #252526;
            }

            .pane-header {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
                color: #cccccc;
            }

            textarea {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            textarea:focus {
                background: #252526;
            }

            .button-group {
                background: #2d2d30;
                border-top-color: #3e3e42;
            }

            .tabs {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
            }

            .tab {
                color: #858585;
            }

            .tab:hover {
                color: #cccccc;
            }

            .json-output {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .diagram-item {
                background: #2d2d30;
                border-color: #3e3e42;
            }

            .diagram-item-content {
                color: #d4d4d4;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [code, setCode] = useState(`module counter_4bit (
    input wire clk,
    input wire reset,
    input wire enable,
    output logic [3:0] count
);

    logic [3:0] count_next;

    always_comb begin
        if (reset) begin
            count_next = 4'b0000;
        end else if (enable) begin
            count_next = count + 1;
        end else begin
            count_next = count;
        end
    end

    always_ff @(posedge clk) begin
        count <= count_next;
    end

endmodule`);

            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('json');

            const handleParse = async () => {
                if (!code.trim()) {
                    setError('Please enter some SystemVerilog code');
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);

                try {
                    const response = await fetch('/api/parse', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code })
                    });

                    const data = await response.json();

                    if (data.parseError) {
                        setError(data.parseError);
                        setResult(data);
                    } else if (data.error) {
                        setError(data.error);
                        setResult(data);
                    } else {
                        setResult(data);
                        if (data.errors.length === 0) {
                            setActiveTab('json');
                        }
                    }
                } catch (err) {
                    setError(`Network error: ${err.message}`);
                    setResult(null);
                } finally {
                    setLoading(false);
                }
            };

            const handleClear = () => {
                setCode('');
                setResult(null);
                setError(null);
            };

            const formatJson = (obj) => {
                try {
                    return JSON.stringify(obj, null, 2);
                } catch {
                    return String(obj);
                }
            };

            const renderDiagramSVG = (module) => {
                const ports = module.ports || [];
                const blocks = module.blocks || [];
                const signals = module.signals || [];

                const boxWidth = 300;
                const boxHeight = 100 + blocks.length * 30;
                const portSize = 12;

                // Input ports (left), output ports (right)
                const inputPorts = ports.filter(p => p.direction === 'input');
                const outputPorts = ports.filter(p => p.direction === 'output' || p.direction === 'inout');

                return (
                    <svg width="100%" height="300" viewBox={`0 0 600 300`} style={{border: '1px solid #ddd', borderRadius: '4px', background: '#fafafa'}}>
                        {/* Module box */}
                        <rect x="100" y="50" width={boxWidth} height={boxHeight} fill="#f0f0f0" stroke="#667eea" strokeWidth="2" rx="4"/>

                        {/* Module name */}
                        <text x="250" y="75" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#333">{module.name}</text>

                        {/* Input ports (left side) */}
                        {inputPorts.map((port, i) => {
                            const y = 110 + i * 25;
                            return (
                                <g key={`in-${i}`}>
                                    <circle cx="100" cy={y} r={portSize/2} fill="#4CAF50"/>
                                    <text x="120" y={y + 4} fontSize="11" fill="#333">{port.name}</text>
                                </g>
                            );
                        })}

                        {/* Output ports (right side) */}
                        {outputPorts.map((port, i) => {
                            const y = 110 + i * 25;
                            return (
                                <g key={`out-${i}`}>
                                    <circle cx={400} cy={y} r={portSize/2} fill={port.direction === 'inout' ? '#9E9E9E' : '#F44336'}/>
                                    <text x="360" y={y + 4} textAnchor="end" fontSize="11" fill="#333">{port.name}</text>
                                </g>
                            );
                        })}

                        {/* Logic blocks */}
                        {blocks.map((block, i) => {
                            const y = 110 + inputPorts.length * 25 + i * 30;
                            const color = block.type === 'always_ff' ? '#2196F3' : block.type === 'always_comb' ? '#FF9800' : '#9C27B0';
                            return (
                                <g key={`block-${i}`}>
                                    <rect x="150" y={y - 8} width="200" height="20" fill={color} rx="2" opacity="0.7"/>
                                    <text x="250" y={y + 5} textAnchor="middle" fontSize="10" fill="white" fontWeight="bold">{block.type}</text>
                                </g>
                            );
                        })}
                    </svg>
                );
            };

            const renderDiagramView = () => {
                if (!result || !result.json) {
                    return <div className="empty">No diagram data</div>;
                }

                const { modules, errors: astErrors } = result.json;

                return (
                    <div className="diagram-container">
                        {astErrors && astErrors.length > 0 && (
                            <div style={{ marginBottom: '12px' }}>
                                <div className="error-banner">
                                    {astErrors.map((err, i) => (
                                        <div key={i}>{err}</div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {modules && modules.length > 0 ? (
                            modules.map((mod, i) => (
                                <div key={i}>
                                    <div className="diagram-item-title" style={{padding: '12px 16px', background: '#667eea', color: 'white', marginBottom: '8px'}}>
                                        📦 Module: {mod.name}
                                    </div>
                                    {renderDiagramSVG(mod)}
                                    <div className="diagram-item" style={{marginTop: '8px', fontSize: '12px'}}>
                                        <strong>Stats:</strong> {mod.ports?.length || 0} ports • {mod.signals?.length || 0} signals • {mod.blocks?.length || 0} blocks
                                    </div>
                                </div>
                            ))
                        ) : (
                            <div className="empty">No modules parsed</div>
                        )}
                    </div>
                );
            };

            return (
                <div className="container">
                    <div className="editor-pane">
                        <div className="header">
                            <div>
                                <h1>🔧 SchemaTeX Prototype Tester</h1>
                                <p>Paste SystemVerilog → See parser output → Verify diagram</p>
                            </div>
                        </div>

                        <div className="pane-header">
                            <h2>Input</h2>
                        </div>

                        <div className="editor-area">
                            <textarea
                                value={code}
                                onChange={(e) => setCode(e.target.value)}
                                placeholder="Paste SystemVerilog code here..."
                            />
                        </div>

                        <div className="button-group">
                            <button className="primary" onClick={handleParse} disabled={loading}>
                                {loading ? (
                                    <>
                                        <span className="spinner"></span>
                                        Parsing...
                                    </>
                                ) : (
                                    '▶ Parse'
                                )}
                            </button>
                            <button className="secondary" onClick={handleClear}>Clear</button>
                        </div>
                    </div>

                    <div className="output-pane">
                        <div className="header" style={{ flex: 0 }}>
                            <div>
                                <h1>Output</h1>
                                <p>{result ? `✅ Parsed successfully` : `Waiting for parse...`}</p>
                            </div>
                        </div>

                        {error && (
                            <div className="error-banner">
                                <strong>❌ Error:</strong> {error}
                            </div>
                        )}

                        {result && result.errors && result.errors.length > 0 && (
                            <div className="error-banner">
                                <strong>⚠️ Parser Warnings:</strong>
                                {result.errors.map((err, i) => (
                                    <div key={i} style={{ marginTop: '4px' }}>{err}</div>
                                ))}
                            </div>
                        )}

                        {result && (
                            <div className="tabs">
                                <button
                                    className={`tab ${activeTab === 'json' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('json')}
                                >
                                    JSON AST
                                </button>
                                <button
                                    className={`tab ${activeTab === 'diagram' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('diagram')}
                                >
                                    Diagram Preview
                                </button>
                            </div>
                        )}

                        <div className="content">
                            {loading ? (
                                <div className="loading">
                                    <span className="spinner"></span>
                                    Processing...
                                </div>
                            ) : result ? (
                                activeTab === 'json' ? (
                                    <div className="json-output">
                                        {formatJson(result.json)}
                                    </div>
                                ) : (
                                    renderDiagramView()
                                )
                            ) : (
                                <div className="empty">👈 Enter SystemVerilog code and click Parse</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
