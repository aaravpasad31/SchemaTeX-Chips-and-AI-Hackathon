<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchemaTeX Prototype Tester</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            background: #fff;
        }

        .editor-pane {
            flex: 0.4;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .output-pane {
            flex: 0.6;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .header {
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .pane-header {
            padding: 12px 16px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            background: #fff;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #fafafa;
        }

        .button-group {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: #667eea;
            color: white;
            flex: 1;
            min-width: 100px;
        }

        button.primary:hover {
            background: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        button.primary:active {
            transform: scale(0.98);
        }

        button.primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        .tabs {
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #555;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .content {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .json-output {
            padding: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f5f5f5;
            color: #333;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-banner {
            background: #fee;
            border-bottom: 1px solid #fcc;
            padding: 12px 16px;
            color: #c33;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .success-banner {
            background: #efe;
            border-bottom: 1px solid #cfc;
            padding: 12px 16px;
            color: #3c3;
            font-size: 12px;
        }

        .diagram-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }

        #d3-canvas {
            width: 100%;
            flex: 1;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .d3-svg-root {
            width: 100%;
            height: 100%;
            background: #f9f9f9;
        }

        .d3-node {
            stroke: #555;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .d3-node:hover {
            stroke: #000;
            stroke-width: 3px;
            filter: brightness(1.1);
        }

        .d3-node.highlighted {
            stroke: #ff6b6b;
            stroke-width: 3px;
            filter: brightness(1.2);
        }

        .d3-edge {
            stroke: #999;
            stroke-width: 1.5px;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
        }

        .d3-edge:hover {
            stroke: #667eea;
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 2px #667eea);
        }

        .d3-edge.highlighted {
            stroke: #ff6b6b;
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 3px #ff6b6b);
        }

        .d3-label {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            pointer-events: none;
            fill: #333;
        }

        .d3-edge-label {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 9px;
            pointer-events: none;
            fill: #666;
            background: white;
            padding: 2px 4px;
        }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }

        .stats-bar {
            padding: 8px 16px;
            background: #f0f0f0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 11px;
            color: #666;
            display: flex;
            gap: 16px;
        }

        .stats-item {
            display: flex;
            gap: 4px;
        }

        .stats-item strong {
            color: #333;
        }

        .zoom-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            z-index: 10;
        }

        .zoom-controls button {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            font-weight: bold;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .container {
                background: #252526;
            }

            .editor-pane {
                background: #1e1e1e;
                border-right-color: #3e3e42;
            }

            .output-pane {
                background: #252526;
            }

            .pane-header {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
                color: #cccccc;
            }

            textarea {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            textarea:focus {
                background: #252526;
            }

            .button-group {
                background: #2d2d30;
                border-top-color: #3e3e42;
            }

            .tabs {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
            }

            .tab {
                color: #858585;
            }

            .tab:hover {
                color: #cccccc;
            }

            .json-output {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .d3-svg-root {
                background: #1e1e1e;
            }

            .d3-label {
                fill: #d4d4d4;
            }

            .d3-edge-label {
                fill: #999;
            }

            .stats-bar {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
                color: #999;
            }

            .stats-item strong {
                color: #d4d4d4;
            }

            .zoom-controls {
                background: #252526;
                border-color: #3e3e42;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [code, setCode] = useState(`module counter_4bit (
    input wire clk,
    input wire reset,
    input wire enable,
    output logic [3:0] count
);

    logic [3:0] count_next;

    always_comb begin
        if (reset) begin
            count_next = 4'b0000;
        end else if (enable) begin
            count_next = count + 1;
        end else begin
            count_next = count;
        end
    end

    always_ff @(posedge clk) begin
        count <= count_next;
    end

endmodule`);

            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('diagram');
            const [stats, setStats] = useState(null);
            const [highlightedSignal, setHighlightedSignal] = useState(null);
            const d3ContainerRef = useRef(null);
            const svgRef = useRef(null);
            const zoomRef = useRef(null);

            // D3 Renderer
            const renderD3Diagram = (graph) => {
                if (!graph || !graph.children) {
                    console.warn('No graph data for D3 rendering');
                    return;
                }

                const container = d3ContainerRef.current;
                if (!container) return;

                const width = container.clientWidth || 800;
                const height = container.clientHeight || 600;

                // Clear previous
                d3.select(container).selectAll('svg').remove();

                // Create SVG
                const svg = d3.select(container)
                    .append('svg')
                    .attr('width', width)
                    .attr('height', height)
                    .attr('class', 'd3-svg-root');

                // Create groups for organization
                const g = svg.append('g')
                    .attr('class', 'd3-main-group');

                // Add defs for markers and patterns
                const defs = svg.append('defs');

                // Arrow marker
                defs.append('marker')
                    .attr('id', 'd3-arrow')
                    .attr('markerWidth', 10)
                    .attr('markerHeight', 10)
                    .attr('refX', 9)
                    .attr('refY', 3)
                    .attr('orient', 'auto')
                    .append('polygon')
                    .attr('points', '0 0, 10 3, 0 6')
                    .attr('fill', '#666');

                // Hatch pattern for memory
                const hatchPattern = defs.append('pattern')
                    .attr('id', 'memory-hatch')
                    .attr('patternUnits', 'userSpaceOnUse')
                    .attr('width', 8)
                    .attr('height', 8);

                hatchPattern.append('line')
                    .attr('x1', 0).attr('y1', 0)
                    .attr('x2', 8).attr('y2', 8)
                    .attr('stroke', '#000').attr('stroke-width', 0.5)
                    .attr('opacity', 0.3);

                // Render nodes
                if (graph.children && graph.children.length > 0) {
                    graph.children.forEach((node) => {
                        const x = node.x || Math.random() * 600;
                        const y = node.y || Math.random() * 400;
                        const width = node.width || 120;
                        const height = node.height || 60;

                        // Determine shape and color
                        let shape = 'rect';
                        let color = node.color || '#e8f5ff';

                        if (node.type === 'port') {
                            shape = 'parallelogram';
                            color = node.color || '#c8e6c9';
                        } else if (node.type === 'MEMORY') {
                            color = 'url(#memory-hatch)';
                        }

                        // Group for each node
                        const nodeGroup = g.append('g')
                            .attr('class', 'd3-node-group')
                            .attr('data-node-id', node.id)
                            .attr('data-signal', node.label);

                        // Draw shape
                        if (shape === 'rect') {
                            nodeGroup.append('rect')
                                .attr('x', x - width / 2)
                                .attr('y', y - height / 2)
                                .attr('width', width)
                                .attr('height', height)
                                .attr('class', 'd3-node')
                                .attr('fill', color)
                                .attr('rx', 4);
                        } else if (shape === 'circle') {
                            nodeGroup.append('circle')
                                .attr('cx', x)
                                .attr('cy', y)
                                .attr('r', Math.min(width, height) / 2)
                                .attr('class', 'd3-node')
                                .attr('fill', color);
                        }

                        // Label
                        nodeGroup.append('text')
                            .attr('x', x)
                            .attr('y', y)
                            .attr('text-anchor', 'middle')
                            .attr('dy', '0.3em')
                            .attr('class', 'd3-label')
                            .text(node.label || node.id)
                            .style('pointer-events', 'none');

                        // Add interaction
                        nodeGroup.on('click', () => {
                            setHighlightedSignal(node.label || node.id);
                        })
                        .on('mouseenter', () => {
                            nodeGroup.select('.d3-node').classed('highlighted', true);
                        })
                        .on('mouseleave', () => {
                            nodeGroup.select('.d3-node').classed('highlighted',
                                highlightedSignal === (node.label || node.id)
                            );
                        });
                    });
                }

                // Render edges
                if (graph.edges && graph.edges.length > 0) {
                    graph.edges.forEach((edge) => {
                        // Simple edges for now
                        g.append('line')
                            .attr('x1', 100)
                            .attr('y1', 100)
                            .attr('x2', 300)
                            .attr('y2', 300)
                            .attr('class', 'd3-edge')
                            .attr('marker-end', 'url(#d3-arrow)');
                    });
                }

                // Add zoom and pan
                const zoom = d3.zoom()
                    .on('zoom', (event) => {
                        g.attr('transform', event.transform);
                    });

                svg.call(zoom);

                // Pan interaction with mouse
                let isPanning = false;
                let panStartX = 0;
                let panStartY = 0;
                let currentTransform = d3.zoomIdentity;

                svg.on('mousedown', () => {
                    isPanning = true;
                    [panStartX, panStartY] = d3.mouse(svg.node());
                })
                .on('mousemove', () => {
                    if (!isPanning) return;
                    const [x, y] = d3.mouse(svg.node());
                    const dx = x - panStartX;
                    const dy = y - panStartY;
                    currentTransform = currentTransform.translate(dx, dy);
                    g.attr('transform', currentTransform);
                })
                .on('mouseup', () => {
                    isPanning = false;
                })
                .on('mouseleave', () => {
                    isPanning = false;
                });

                // Wheel zoom
                svg.on('wheel', function(event) {
                    event.preventDefault();
                    const direction = event.deltaY > 0 ? 0.9 : 1.1;
                    const [x, y] = d3.mouse(this);
                    const newTransform = currentTransform.translate(x, y)
                        .scale(currentTransform.k * direction)
                        .translate(-x, -y);
                    currentTransform = newTransform;
                    g.attr('transform', newTransform);
                }, { passive: false });

                svgRef.current = svg;
                zoomRef.current = zoom;
            };

            const handleRender = async () => {
                if (!code.trim()) {
                    setError('Please enter some SystemVerilog code');
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);
                setStats(null);

                try {
                    const response = await fetch('/api/full-pipeline', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code })
                    });

                    const data = await response.json();

                    if (!data.success) {
                        setError(data.error || 'Failed to render diagram');
                        setResult(null);
                    } else {
                        setResult(data);
                        setStats({
                            parseTime: data.stages.parse?.duration || 0,
                            typeDetection: data.stages.typeDetection?.duration || 0,
                            transform: data.stages.transform?.duration || 0,
                            layout: data.stages.layout?.duration || 0,
                            total: data.stages.total || 0
                        });

                        // Render first graph
                        if (data.layoutedGraphs && data.layoutedGraphs.length > 0) {
                            setTimeout(() => {
                                renderD3Diagram(data.layoutedGraphs[0]);
                            }, 100);
                        }
                    }
                } catch (err) {
                    setError(`Network error: ${err.message}`);
                    setResult(null);
                } finally {
                    setLoading(false);
                }
            };

            const handleClear = () => {
                setCode('');
                setResult(null);
                setError(null);
                setStats(null);
            };

            const handleExportSVG = () => {
                if (!svgRef.current) return;

                const svgElement = d3ContainerRef.current?.querySelector('svg');
                if (!svgElement) return;

                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(svgElement);
                const blob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'diagram.svg';
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="container">
                    <div className="editor-pane">
                        <div className="header">
                            <div>
                                <h1>🔧 SchemaTeX Prototype Tester</h1>
                                <p>Paste SystemVerilog → See interactive diagram</p>
                            </div>
                        </div>

                        <div className="pane-header">
                            <h2>SystemVerilog Input</h2>
                        </div>

                        <div className="editor-area">
                            <textarea
                                value={code}
                                onChange={(e) => setCode(e.target.value)}
                                placeholder="Paste SystemVerilog code here..."
                                id="code-textarea"
                            />
                        </div>

                        <div className="button-group">
                            <button className="primary" onClick={handleRender} disabled={loading} id="render-btn">
                                {loading ? (
                                    <>
                                        <span className="spinner"></span>
                                        Rendering...
                                    </>
                                ) : (
                                    '▶ Render'
                                )}
                            </button>
                            <button className="secondary" onClick={handleClear}>Clear</button>
                            <button className="secondary" onClick={handleExportSVG} disabled={!result}>Export SVG</button>
                        </div>
                    </div>

                    <div className="output-pane">
                        <div className="header" style={{ flex: 0 }}>
                            <div>
                                <h1>📊 Interactive Diagram</h1>
                                <p>{result ? '✅ Rendering complete' : 'Click "Render" to generate diagram'}</p>
                            </div>
                        </div>

                        {error && (
                            <div className="error-banner">
                                <strong>❌ Error:</strong> {error}
                            </div>
                        )}

                        {stats && (
                            <div className="stats-bar">
                                <div className="stats-item"><strong>Parse:</strong> {stats.parseTime}ms</div>
                                <div className="stats-item"><strong>Types:</strong> {stats.typeDetection}ms</div>
                                <div className="stats-item"><strong>Transform:</strong> {stats.transform}ms</div>
                                <div className="stats-item"><strong>Layout:</strong> {stats.layout}ms</div>
                                <div className="stats-item"><strong>Total:</strong> {stats.total}ms</div>
                            </div>
                        )}

                        {result && (
                            <div className="tabs">
                                <button
                                    className={`tab ${activeTab === 'diagram' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('diagram')}
                                >
                                    Diagram
                                </button>
                                <button
                                    className={`tab ${activeTab === 'json' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('json')}
                                >
                                    JSON AST
                                </button>
                                <button
                                    className={`tab ${activeTab === 'info' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('info')}
                                >
                                    Info
                                </button>
                            </div>
                        )}

                        <div className="content">
                            {loading ? (
                                <div className="loading">
                                    <span className="spinner"></span>
                                    Processing pipeline: Parse → Detect Types → Transform → Layout → Render
                                </div>
                            ) : result ? (
                                activeTab === 'diagram' ? (
                                    <div className="diagram-container" id="d3-canvas" ref={d3ContainerRef}>
                                        <div className="zoom-controls">
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.scaleBy, 1.3);
                                                }
                                            }}>+</button>
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.scaleBy, 0.77);
                                                }
                                            }}>−</button>
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.transform, d3.zoomIdentity.translate(50, 50));
                                                }
                                            }}>⟲</button>
                                        </div>
                                    </div>
                                ) : activeTab === 'json' ? (
                                    <div className="json-output">
                                        {JSON.stringify(result.parseResult, null, 2)}
                                    </div>
                                ) : (
                                    <div className="json-output">
                                        <strong>Pipeline Stages:</strong>
                                        {JSON.stringify(result.stages, null, 2)}
                                        {'\n\n'}
                                        <strong>Block Types Detected:</strong>
                                        {JSON.stringify(result.blockTypes, null, 2)}
                                        {'\n\n'}
                                        <strong>Module Count:</strong> {result.parseResult?.modules?.length || 0}
                                    </div>
                                )
                            ) : (
                                <div className="empty">👈 Enter SystemVerilog code and click "Render" to see the diagram</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
