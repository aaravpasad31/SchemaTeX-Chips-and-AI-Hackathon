<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchemaTeX Prototype Tester</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            background: #fff;
        }

        .editor-pane {
            flex: 0.4;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .output-pane {
            flex: 0.6;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .header {
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .pane-header {
            padding: 12px 16px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            background: #fff;
            color: #333;
        }

        textarea:focus {
            outline: none;
            background: #fafafa;
        }

        .button-group {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: #667eea;
            color: white;
            flex: 1;
            min-width: 100px;
        }

        button.primary:hover {
            background: #5568d3;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        button.primary:active {
            transform: scale(0.98);
        }

        button.primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        .tabs {
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #555;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .content {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .json-output {
            padding: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f5f5f5;
            color: #333;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-banner {
            background: #fee;
            border-bottom: 1px solid #fcc;
            padding: 12px 16px;
            color: #c33;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .success-banner {
            background: #efe;
            border-bottom: 1px solid #cfc;
            padding: 12px 16px;
            color: #3c3;
            font-size: 12px;
        }

        .diagram-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }

        #d3-canvas {
            width: 100%;
            flex: 1;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .d3-svg-root {
            width: 100%;
            height: 100%;
            background: #f9f9f9;
        }

        .d3-node {
            stroke: #555;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .d3-node:hover {
            stroke: #000;
            stroke-width: 3px;
            filter: brightness(1.1);
        }

        .d3-node.highlighted {
            stroke: #ff6b6b;
            stroke-width: 3px;
            filter: brightness(1.2);
        }

        .d3-edge {
            stroke: #999;
            stroke-width: 1.5px;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
        }

        .d3-edge.bus {
            stroke-width: 3.5px;
        }

        /* Signal type colors */
        .d3-edge.signal-clock {
            stroke: #2196F3;  /* Blue for clock */
        }

        .d3-edge.signal-reset {
            stroke: #FF5252;  /* Red for reset */
        }

        .d3-edge.signal-data {
            stroke: #666;     /* Gray for data */
        }

        .d3-edge.signal-power {
            stroke: #FFC107;  /* Amber for power */
        }

        .d3-edge:hover {
            filter: drop-shadow(0 0 2px currentColor);
        }

        .d3-edge.bus:hover {
            stroke-width: 4.5px;
        }

        .d3-edge.highlighted {
            stroke: #ff6b6b;
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 3px #ff6b6b);
        }

        .d3-edge.bus.highlighted {
            stroke-width: 4.5px;
        }

        .d3-width-label {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 9px;
            pointer-events: none;
            fill: #666;
            background: white;
            padding: 2px 4px;
        }

        .d3-label {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 11px;
            pointer-events: none;
            fill: #333;
        }

        .d3-edge-label {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 9px;
            pointer-events: none;
            fill: #666;
            background: white;
            padding: 2px 4px;
        }

        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }

        .stats-bar {
            padding: 8px 16px;
            background: #f0f0f0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 11px;
            color: #666;
            display: flex;
            gap: 16px;
        }

        .stats-item {
            display: flex;
            gap: 4px;
        }

        .stats-item strong {
            color: #333;
        }

        .zoom-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            z-index: 10;
        }

        .zoom-controls button {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            font-weight: bold;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .container {
                background: #252526;
            }

            .editor-pane {
                background: #1e1e1e;
                border-right-color: #3e3e42;
            }

            .output-pane {
                background: #252526;
            }

            .pane-header {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
                color: #cccccc;
            }

            textarea {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            textarea:focus {
                background: #252526;
            }

            .button-group {
                background: #2d2d30;
                border-top-color: #3e3e42;
            }

            .tabs {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
            }

            .tab {
                color: #858585;
            }

            .tab:hover {
                color: #cccccc;
            }

            .json-output {
                background: #1e1e1e;
                color: #d4d4d4;
            }

            .d3-svg-root {
                background: #1e1e1e;
            }

            .d3-label {
                fill: #d4d4d4;
            }

            .d3-edge-label {
                fill: #999;
            }

            .stats-bar {
                background: #2d2d30;
                border-bottom-color: #3e3e42;
                color: #999;
            }

            .stats-item strong {
                color: #d4d4d4;
            }

            .zoom-controls {
                background: #252526;
                border-color: #3e3e42;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const examples = {
                'counter_4bit': {
                    name: '4-bit Counter',
                    code: `module counter_4bit (
    input wire clk,
    input wire reset,
    input wire enable,
    output logic [3:0] count
);

    logic [3:0] count_next;

    always_comb begin
        if (reset) begin
            count_next = 4'b0000;
        end else if (enable) begin
            count_next = count + 1;
        end else begin
            count_next = count;
        end
    end

    always_ff @(posedge clk) begin
        count <= count_next;
    end

endmodule`
                },
                'hierarchical': {
                    name: 'Hierarchical',
                    code: `module top_level (
    input  wire       clk,
    input  wire [7:0] data_in,
    output wire [7:0] data_out
);

    alu_unit alu_inst (
        .clk(clk),
        .a(data_in),
        .b(8'h00),
        .result()
    );

    memory_unit mem_inst (
        .clk(clk),
        .addr(3'b000),
        .data_out(data_out)
    );

    control_unit ctrl_inst (
        .clk(clk),
        .enable(1'b1)
    );

endmodule`
                },
                'combinational': {
                    name: 'Combinational',
                    code: `module mux_4to1 (
    input  wire [1:0] sel,
    input  wire [7:0] a,
    input  wire [7:0] b,
    input  wire [7:0] c,
    input  wire [7:0] d,
    output logic [7:0] out
);

    always_comb begin
        case (sel)
            2'b00: out = a;
            2'b01: out = b;
            2'b10: out = c;
            2'b11: out = d;
            default: out = 8'b0;
        endcase
    end

endmodule`
                },
                'sequential': {
                    name: 'Sequential',
                    code: `module shift_register (
    input  wire       clk,
    input  wire       reset,
    input  wire       sin,
    output logic [3:0] sout
);

    logic [3:0] sreg;

    always_ff @(posedge clk) begin
        if (reset) begin
            sreg <= 4'b0000;
        end else begin
            sreg <= {sreg[2:0], sin};
        end
    end

    assign sout = sreg;

endmodule`
                },
                'state_machine': {
                    name: 'State Machine',
                    code: `module fsm_controller (
    input  wire clk,
    input  wire reset,
    input  wire start,
    output logic done
);

    typedef enum logic [2:0] {
        IDLE = 3'b000,
        RUNNING = 3'b001,
        DONE = 3'b010
    } state_t;

    state_t state, next_state;

    always_ff @(posedge clk) begin
        if (reset)
            state <= IDLE;
        else
            state <= next_state;
    end

    always_comb begin
        next_state = IDLE;
        done = 1'b0;
        case (state)
            IDLE: if (start) next_state = RUNNING;
            RUNNING: next_state = DONE;
            DONE: next_state = IDLE; done = 1'b1;
        endcase
    end

endmodule`
                },
                'memory': {
                    name: 'Memory',
                    code: `module ram_32x8 (
    input  wire       clk,
    input  wire [4:0] addr,
    input  wire [7:0] din,
    input  wire       we,
    output logic [7:0] dout
);

    logic [7:0] mem [31:0];

    always_ff @(posedge clk) begin
        if (we) begin
            mem[addr] <= din;
        end
        dout <= mem[addr];
    end

endmodule`
                },
                'mixed': {
                    name: 'Mixed',
                    code: `module mixed_logic (
    input  wire       clk,
    input  wire [3:0] in_a,
    input  wire [3:0] in_b,
    output logic [7:0] result
);

    logic [7:0] combined;
    logic [3:0] sum;

    always_comb begin
        sum = in_a + in_b;
    end

    always_ff @(posedge clk) begin
        combined <= {in_b, in_a};
        result <= {combined[3:0], sum};
    end

endmodule`
                }
            };

            const [selectedExample, setSelectedExample] = useState('counter_4bit');
            const [code, setCode] = useState(examples.counter_4bit.code);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('diagram');
            const [stats, setStats] = useState(null);
            const [highlightedSignal, setHighlightedSignal] = useState(null);
            const d3ContainerRef = useRef(null);
            const svgRef = useRef(null);
            const zoomRef = useRef(null);

            const handleExampleChange = (exampleKey) => {
                setSelectedExample(exampleKey);
                setCode(examples[exampleKey].code);
            };

            // D3 Renderer
            const renderD3Diagram = (graph) => {
                if (!graph || !graph.children) {
                    console.warn('No graph data for D3 rendering');
                    return;
                }

                const container = d3ContainerRef.current;
                if (!container) return;

                const width = container.clientWidth || 800;
                const height = container.clientHeight || 600;

                // Clear previous
                d3.select(container).selectAll('svg').remove();

                // Create SVG
                const svg = d3.select(container)
                    .append('svg')
                    .attr('width', width)
                    .attr('height', height)
                    .attr('class', 'd3-svg-root');

                // Create groups for organization
                const g = svg.append('g')
                    .attr('class', 'd3-main-group');

                // Collision detection utilities
                const collisionRects = [];

                function checkLabelCollision(labelX, labelY, labelWidth, labelHeight) {
                    const labelRect = {
                        x: labelX - labelWidth / 2,
                        y: labelY - labelHeight / 2,
                        width: labelWidth,
                        height: labelHeight,
                        right() { return this.x + this.width; },
                        bottom() { return this.y + this.height; }
                    };

                    for (const rect of collisionRects) {
                        if (!(labelRect.right() < rect.x || labelRect.x > rect.right() ||
                              labelRect.bottom() < rect.y || labelRect.y > rect.bottom())) {
                            return true; // Collision detected
                        }
                    }
                    return false;
                }

                function findLabelPosition(nodeX, nodeY, nodeWidth, nodeHeight, idealOffset) {
                    const positions = [
                        { x: nodeX, y: nodeY - nodeHeight/2 - 15, offsetY: -1 }, // top
                        { x: nodeX, y: nodeY + nodeHeight/2 + 15, offsetY: 1 },  // bottom
                        { x: nodeX - nodeWidth/2 - 15, y: nodeY, offsetX: -1 },  // left
                        { x: nodeX + nodeWidth/2 + 15, y: nodeY, offsetX: 1 },   // right
                    ];

                    for (const pos of positions) {
                        if (!checkLabelCollision(pos.x, pos.y, 100, 20)) {
                            return pos;
                        }
                    }
                    // If all positions collide, use the first one anyway
                    return positions[0];
                }

                function registerLabelRect(x, y, width, height) {
                    collisionRects.push({
                        x: x - width / 2,
                        y: y - height / 2,
                        width: width,
                        height: height,
                        right() { return this.x + this.width; },
                        bottom() { return this.y + this.height; }
                    });
                }

                // Add defs for markers and patterns
                const defs = svg.append('defs');

                // Arrow marker
                defs.append('marker')
                    .attr('id', 'd3-arrow')
                    .attr('markerWidth', 10)
                    .attr('markerHeight', 10)
                    .attr('refX', 9)
                    .attr('refY', 3)
                    .attr('orient', 'auto')
                    .append('polygon')
                    .attr('points', '0 0, 10 3, 0 6')
                    .attr('fill', '#666');

                // Clock signal marker (triangle pointing up)
                defs.append('marker')
                    .attr('id', 'd3-clock-marker')
                    .attr('markerWidth', 8)
                    .attr('markerHeight', 8)
                    .attr('refX', 4)
                    .attr('refY', 4)
                    .attr('orient', 'auto')
                    .append('polygon')
                    .attr('points', '0 0, 4 8, 8 0')
                    .attr('fill', '#2196F3');

                // Reset signal marker (circle with X)
                const resetMarker = defs.append('marker')
                    .attr('id', 'd3-reset-marker')
                    .attr('markerWidth', 8)
                    .attr('markerHeight', 8)
                    .attr('refX', 4)
                    .attr('refY', 4)
                    .attr('orient', 'auto');

                resetMarker.append('circle')
                    .attr('cx', 4)
                    .attr('cy', 4)
                    .attr('r', 3.5)
                    .attr('fill', 'none')
                    .attr('stroke', '#FF5252')
                    .attr('stroke-width', 1);

                resetMarker.append('line')
                    .attr('x1', 1)
                    .attr('y1', 1)
                    .attr('x2', 7)
                    .attr('y2', 7)
                    .attr('stroke', '#FF5252')
                    .attr('stroke-width', 1);

                resetMarker.append('line')
                    .attr('x1', 7)
                    .attr('y1', 1)
                    .attr('x2', 1)
                    .attr('y2', 7)
                    .attr('stroke', '#FF5252')
                    .attr('stroke-width', 1);

                // Hatch pattern for memory
                const hatchPattern = defs.append('pattern')
                    .attr('id', 'memory-hatch')
                    .attr('patternUnits', 'userSpaceOnUse')
                    .attr('width', 8)
                    .attr('height', 8);

                hatchPattern.append('line')
                    .attr('x1', 0).attr('y1', 0)
                    .attr('x2', 8).attr('y2', 8)
                    .attr('stroke', '#000').attr('stroke-width', 0.5)
                    .attr('opacity', 0.3);

                // Separate ports, blocks, and hierarchical containers
                const portNodes = [];
                const blockNodes = [];
                const containerNodes = [];
                const allNodes = [];

                if (graph.children && graph.children.length > 0) {
                    graph.children.forEach((node) => {
                        const nodeType = node.properties?.nodeType || node.type;
                        allNodes.push(node);

                        if (nodeType === 'port') {
                            portNodes.push(node);
                        } else if (nodeType === 'hierarchical_container') {
                            containerNodes.push(node);
                            if (node.children) {
                                node.children.forEach(child => allNodes.push(child));
                            }
                        } else {
                            blockNodes.push(node);
                        }
                    });
                }

                // Render hierarchical containers FIRST (so they appear behind children)
                containerNodes.forEach((container) => {
                    const x = container.x || 0;
                    const y = container.y || 0;
                    const width = container.width || 400;
                    const height = container.height || 300;

                    const containerGroup = g.append('g')
                        .attr('class', 'd3-container-group')
                        .attr('data-node-id', container.id);

                    // Draw container box (black border, no fill) - positioned in global space
                    containerGroup.append('rect')
                        .attr('x', x - width / 2)
                        .attr('y', y - height / 2)
                        .attr('width', width)
                        .attr('height', height)
                        .attr('class', 'd3-container')
                        .attr('fill', 'transparent')
                        .attr('stroke', '#000')
                        .attr('stroke-width', 2)
                        .attr('rx', 4);

                    // Container title - positioned in global space with collision detection
                    const containerLabelPos = findLabelPosition(x, y - height/2 + 20, width - 20, 20, { x: 0, y: -1 });
                    containerGroup.append('text')
                        .attr('x', containerLabelPos.x)
                        .attr('y', containerLabelPos.y)
                        .attr('class', 'd3-label')
                        .attr('font-weight', 'bold')
                        .attr('font-size', '14px')
                        .text(container.label || container.id)
                        .style('pointer-events', 'none');
                    registerLabelRect(containerLabelPos.x, containerLabelPos.y, 100, 20);

                    // Create a subgroup for children positioned relative to container center
                    const childrenGroup = containerGroup.append('g')
                        .attr('class', 'd3-children-group')
                        .attr('transform', `translate(${x}, ${y})`); // Offset to container center

                    // Render port markers on container edges (in global space)
                    if (container.properties?.ports && container.properties.ports.length > 0) {
                        const allPorts = container.properties.ports;
                        const leftPorts = allPorts.filter(p => p.side === 'LEFT' || (p.side === undefined && p.direction === 'input'));
                        const rightPorts = allPorts.filter(p => p.side === 'RIGHT' || (p.side === undefined && p.direction === 'output'));
                        const topPorts = allPorts.filter(p => p.side === 'TOP');
                        const bottomPorts = allPorts.filter(p => p.side === 'BOTTOM');

                        // Helper function to get port color
                        const getPortColor = (port) => {
                            const signalType = port.properties?.signalType || 'data';
                            const portColors = {
                                'clock': '#2196F3',
                                'reset': '#FF5252',
                                'data': '#888',
                                'power': '#FFC107'
                            };
                            return portColors[signalType] || '#888';
                        };

                        // Left ports (inputs)
                        leftPorts.forEach((port, idx) => {
                            const portY = y - height/2 + ((idx + 1) / (leftPorts.length + 1)) * height;
                            const portX = x - width/2;
                            const labelX = portX - 25;
                            const labelY = portY;

                            containerGroup.append('circle')
                                .attr('cx', portX - 8)
                                .attr('cy', portY)
                                .attr('r', 4)
                                .attr('fill', getPortColor(port))
                                .attr('data-port-id', port.name);

                            containerGroup.append('text')
                                .attr('x', labelX)
                                .attr('y', labelY)
                                .attr('text-anchor', 'end')
                                .attr('dy', '0.3em')
                                .attr('class', 'd3-label')
                                .attr('font-size', '10px')
                                .text(port.name)
                                .style('pointer-events', 'none');
                            registerLabelRect(labelX, labelY, 60, 12);
                        });

                        // Right ports (outputs)
                        rightPorts.forEach((port, idx) => {
                            const portY = y - height/2 + ((idx + 1) / (rightPorts.length + 1)) * height;
                            const portX = x + width/2;
                            const labelX = portX + 25;
                            const labelY = portY;

                            containerGroup.append('circle')
                                .attr('cx', portX + 8)
                                .attr('cy', portY)
                                .attr('r', 4)
                                .attr('fill', getPortColor(port))
                                .attr('data-port-id', port.name);

                            containerGroup.append('text')
                                .attr('x', labelX)
                                .attr('y', labelY)
                                .attr('text-anchor', 'start')
                                .attr('dy', '0.3em')
                                .attr('class', 'd3-label')
                                .attr('font-size', '10px')
                                .text(port.name)
                                .style('pointer-events', 'none');
                            registerLabelRect(labelX, labelY, 60, 12);
                        });

                        // Top ports (power supply)
                        topPorts.forEach((port, idx) => {
                            const portX = x - width/2 + ((idx + 1) / (topPorts.length + 1)) * width;
                            const portY = y - height/2;
                            const labelX = portX;
                            const labelY = portY - 20;

                            containerGroup.append('circle')
                                .attr('cx', portX)
                                .attr('cy', portY - 8)
                                .attr('r', 4)
                                .attr('fill', getPortColor(port))
                                .attr('data-port-id', port.name);

                            containerGroup.append('text')
                                .attr('x', labelX)
                                .attr('y', labelY)
                                .attr('text-anchor', 'middle')
                                .attr('dy', '0.3em')
                                .attr('class', 'd3-label')
                                .attr('font-size', '10px')
                                .text(port.name)
                                .style('pointer-events', 'none');
                            registerLabelRect(labelX, labelY, 60, 12);
                        });

                        // Bottom ports (ground)
                        bottomPorts.forEach((port, idx) => {
                            const portX = x - width/2 + ((idx + 1) / (bottomPorts.length + 1)) * width;
                            const portY = y + height/2;
                            const labelX = portX;
                            const labelY = portY + 20;

                            containerGroup.append('circle')
                                .attr('cx', portX)
                                .attr('cy', portY + 8)
                                .attr('r', 4)
                                .attr('fill', getPortColor(port))
                                .attr('data-port-id', port.name);

                            containerGroup.append('text')
                                .attr('x', labelX)
                                .attr('y', labelY)
                                .attr('text-anchor', 'middle')
                                .attr('dy', '0.3em')
                                .attr('class', 'd3-label')
                                .attr('font-size', '10px')
                                .text(port.name)
                                .style('pointer-events', 'none');
                            registerLabelRect(labelX, labelY, 60, 12);
                        });
                    }

                    // Render children (instances) inside the container (in local container space)
                    if (container.children && container.children.length > 0) {
                        // If ELK didn't compute positions for children, compute them manually
                        const numChildren = container.children.length;
                        const cols = Math.ceil(Math.sqrt(numChildren));
                        const rows = Math.ceil(numChildren / cols);
                        const cellWidth = (width - 40) / cols;
                        const cellHeight = (height - 60) / rows;

                        container.children.forEach((instanceNode, idx) => {
                            // Use ELK-computed coordinates (trust ELK layout!)
                            // ELK positions are in absolute coordinates; convert to relative to container
                            let instX = instanceNode.x !== null && instanceNode.x !== undefined ? (instanceNode.x - x) : undefined;
                            let instY = instanceNode.y !== null && instanceNode.y !== undefined ? (instanceNode.y - y) : undefined;

                            // Only use fallback if ELK truly failed
                            if (instX === undefined || instY === undefined || (instX === 0 && instY === 0)) {
                                // Fallback: simple grid (ELK should have positioned these)
                                const col = idx % 2;  // 2 columns instead of sqrt
                                const row = Math.floor(idx / 2);
                                const rowHeight = 150;
                                instX = col * (width / 2.5);  // Left/right columns
                                instY = -height/2 + 80 + row * rowHeight;
                            }

                            const instWidth = instanceNode.width || 120;
                            const instHeight = instanceNode.height || 80;

                            const instGroup = childrenGroup.append('g')
                                .attr('class', 'd3-node-group')
                                .attr('data-node-id', instanceNode.id);

                            // Instance box (filled, light blue)
                            instGroup.append('rect')
                                .attr('x', instX - instWidth / 2)
                                .attr('y', instY - instHeight / 2)
                                .attr('width', instWidth)
                                .attr('height', instHeight)
                                .attr('class', 'd3-node')
                                .attr('fill', '#e1f5fe')
                                .attr('stroke', '#000')
                                .attr('stroke-width', 1.5)
                                .attr('rx', 4);

                            // Instance label with smart positioning
                            const labelPos = findLabelPosition(instX, instY, instWidth, instHeight, { x: 0, y: 0 });
                            const labelX = labelPos.x !== undefined ? labelPos.x : instX;
                            const labelY = labelPos.y !== undefined ? labelPos.y : instY;

                            instGroup.append('text')
                                .attr('x', labelX)
                                .attr('y', labelY)
                                .attr('text-anchor', 'middle')
                                .attr('dy', '0.3em')
                                .attr('class', 'd3-label')
                                .attr('font-weight', 'bold')
                                .text(instanceNode.label || instanceNode.id)
                                .style('pointer-events', 'none');
                            registerLabelRect(labelX, labelY, 100, 20);
                        });
                    }
                });

                // Render ONLY logic blocks (not port nodes as boxes)
                blockNodes.forEach((node) => {
                    const x = node.x || Math.random() * 600;
                    const y = node.y || Math.random() * 400;
                    const width = node.width || 120;
                    const height = node.height || 80;
                    const color = node.properties?.color || node.color || '#bbdefb';

                    // Group for each block node
                    const nodeGroup = g.append('g')
                        .attr('class', 'd3-node-group')
                        .attr('data-node-id', node.id)
                        .attr('data-signal', node.label);

                    // Check if this is a memory block
                    const isMemory = node.properties?.blockType === 'MEMORY';

                    // Draw rectangle block
                    nodeGroup.append('rect')
                        .attr('x', x - width / 2)
                        .attr('y', y - height / 2)
                        .attr('width', width)
                        .attr('height', height)
                        .attr('class', 'd3-node' + (isMemory ? ' memory' : ''))
                        .attr('fill', isMemory ? 'url(#memory-hatch)' : color)
                        .attr('stroke', '#000')
                        .attr('stroke-width', 1.5)
                        .attr('rx', 4);

                    // Block label with collision detection
                    const blockLabelPos = findLabelPosition(x, y - height/4, width, height, { x: 0, y: -1 });
                    const blockLabelX = blockLabelPos.x !== undefined ? blockLabelPos.x : x;
                    const blockLabelY = blockLabelPos.y !== undefined ? blockLabelPos.y : (y - height/4);

                    nodeGroup.append('text')
                        .attr('x', blockLabelX)
                        .attr('y', blockLabelY)
                        .attr('text-anchor', 'middle')
                        .attr('class', 'd3-label')
                        .attr('font-weight', 'bold')
                        .text(node.label || node.id)
                        .style('pointer-events', 'none');
                    registerLabelRect(blockLabelX, blockLabelY, 100, 20);

                    // Draw port markers on block edges
                    const inputPorts = portNodes.filter(p => p.properties?.direction === 'input');
                    const outputPorts = portNodes.filter(p => p.properties?.direction === 'output');

                    // Input port markers (left side) with collision detection
                    inputPorts.forEach((port, idx) => {
                        const portY = y - height/2 + ((idx + 1) / (inputPorts.length + 1)) * height;
                        const portX = x - width/2;
                        const labelX = portX - 30;
                        const labelY = portY;

                        // Port circle
                        nodeGroup.append('circle')
                            .attr('cx', portX - 10)
                            .attr('cy', portY)
                            .attr('r', 4)
                            .attr('fill', '#888');

                        // Port label with collision detection
                        nodeGroup.append('text')
                            .attr('x', labelX)
                            .attr('y', labelY)
                            .attr('text-anchor', 'end')
                            .attr('dy', '0.3em')
                            .attr('class', 'd3-label')
                            .attr('font-size', '10px')
                            .text(port.label || '')
                            .style('pointer-events', 'none');
                        registerLabelRect(labelX, labelY, 60, 12);
                    });

                    // Output port markers (right side) with collision detection
                    outputPorts.forEach((port, idx) => {
                        const portY = y - height/2 + ((idx + 1) / (outputPorts.length + 1)) * height;
                        const portX = x + width/2;
                        const labelX = portX + 30;
                        const labelY = portY;

                        // Port circle
                        nodeGroup.append('circle')
                            .attr('cx', portX + 10)
                            .attr('cy', portY)
                            .attr('r', 4)
                            .attr('fill', '#888');

                        // Port label with collision detection
                        nodeGroup.append('text')
                            .attr('x', labelX)
                            .attr('y', labelY)
                            .attr('text-anchor', 'start')
                            .attr('dy', '0.3em')
                            .attr('class', 'd3-label')
                            .attr('font-size', '10px')
                            .text(port.label || '')
                            .style('pointer-events', 'none');
                        registerLabelRect(labelX, labelY, 60, 12);
                    });

                    // Add interaction
                    nodeGroup.on('click', () => {
                        setHighlightedSignal(node.label || node.id);
                    })
                    .on('mouseenter', () => {
                        nodeGroup.select('.d3-node').classed('highlighted', true);
                    })
                    .on('mouseleave', () => {
                        nodeGroup.select('.d3-node').classed('highlighted',
                            highlightedSignal === (node.label || node.id)
                        );
                    });
                });

                // Build node position map (including all nodes: blocks, instances, ports, containers)
                const nodePositions = {};
                allNodes.forEach((node) => {
                    nodePositions[node.id] = {
                        x: node.x || 0,
                        y: node.y || 0,
                    };
                });
                // Also add containers
                containerNodes.forEach((container) => {
                    nodePositions[container.id] = {
                        x: container.x || 0,
                        y: container.y || 0,
                    };

                    // For instances inside containers, compute positions if ELK didn't provide them
                    if (container.children && container.children.length > 0) {
                        const numChildren = container.children.length;
                        const cols = Math.ceil(Math.sqrt(numChildren));
                        const rows = Math.ceil(numChildren / cols);
                        const cellWidth = (container.width - 40) / cols;
                        const cellHeight = (container.height - 60) / rows;
                        const containerX = container.x || 0;
                        const containerY = container.y || 0;

                        container.children.forEach((instanceNode, idx) => {
                            let instX = instanceNode.x;
                            let instY = instanceNode.y;

                            // If ELK didn't compute coordinates, compute them manually
                            if (instX === null || instX === undefined) {
                                const col = idx % cols;
                                const row = Math.floor(idx / cols);
                                instX = containerX - container.width/2 + 20 + col * cellWidth + cellWidth/2;
                                instY = containerY - container.height/2 + 50 + row * cellHeight + cellHeight/2;
                            }

                            nodePositions[instanceNode.id] = {
                                x: instX,
                                y: instY,
                            };
                        });
                    }
                });
                // Also add ports
                portNodes.forEach((node) => {
                    nodePositions[node.id] = {
                        x: node.x || 0,
                        y: node.y || 0,
                    };
                });

                // Render edges connecting nodes
                if (graph.edges && graph.edges.length > 0) {
                    graph.edges.forEach((edge) => {
                        // Get source and target positions
                        const sourceId = edge.sources?.[0] || edge.source;
                        const targetId = edge.targets?.[0] || edge.target;

                        let sourcePos = nodePositions[sourceId];
                        const targetPos = nodePositions[targetId];

                        // Only draw if both nodes exist
                        if (sourcePos && targetPos) {
                            // If source is a container, calculate port position on the edge
                            const sourceContainer = containerNodes.find(c => c.id === sourceId);
                            if (sourceContainer && edge.properties?.portName) {
                                const portName = edge.properties.portName;
                                const port = sourceContainer.properties?.ports?.find(p => p.name === portName);

                                if (port) {
                                    const containerX = sourceContainer.x || 0;
                                    const containerY = sourceContainer.y || 0;
                                    const containerWidth = sourceContainer.width || 400;
                                    const containerHeight = sourceContainer.height || 300;

                                    const allPorts = sourceContainer.properties?.ports || [];
                                    const inputPorts = allPorts.filter(p => p.direction === 'input');
                                    const outputPorts = allPorts.filter(p => p.direction === 'output');

                                    if (port.direction === 'input') {
                                        const portIndex = inputPorts.indexOf(port);
                                        const portY = containerY - containerHeight/2 + ((portIndex + 1) / (inputPorts.length + 1)) * containerHeight;
                                        sourcePos = { x: containerX - containerWidth/2 - 8, y: portY };
                                    } else {
                                        const portIndex = outputPorts.indexOf(port);
                                        const portY = containerY - containerHeight/2 + ((portIndex + 1) / (outputPorts.length + 1)) * containerHeight;
                                        sourcePos = { x: containerX + containerWidth/2 + 8, y: portY };
                                    }
                                }
                            }

                            // Draw curved path (quadratic Bézier curve)
                            const midX = (sourcePos.x + targetPos.x) / 2;
                            const midY = (sourcePos.y + targetPos.y) / 2 + 30; // Offset for curve

                            const pathData = `M ${sourcePos.x} ${sourcePos.y}
                                           Q ${midX} ${midY} ${targetPos.x} ${targetPos.y}`;

                            const edgeGroup = g.append('g')
                                .attr('class', 'd3-edge-group');

                            // Check if this is a bus (multi-bit signal)
                            const isBus = edge.properties?.isBus || false;
                            const signalType = edge.properties?.signalType || 'data';
                            const strokeWidth = isBus ? 3.5 : 1.5;

                            // Get stroke color based on signal type
                            const signalColors = {
                                'clock': '#2196F3',
                                'reset': '#FF5252',
                                'data': '#666',
                                'power': '#FFC107'
                            };
                            const strokeColor = signalColors[signalType] || '#666';

                            // Build class list
                            let edgeClass = 'd3-edge';
                            if (isBus) edgeClass += ' bus';
                            edgeClass += ` signal-${signalType}`;

                            // Select appropriate marker based on signal type
                            let marker = 'url(#d3-arrow)';
                            if (signalType === 'clock') {
                                marker = 'url(#d3-clock-marker)';
                            } else if (signalType === 'reset') {
                                marker = 'url(#d3-reset-marker)';
                            }

                            // Draw edge path
                            edgeGroup.append('path')
                                .attr('d', pathData)
                                .attr('class', edgeClass)
                                .attr('fill', 'none')
                                .attr('stroke', strokeColor)
                                .attr('stroke-width', strokeWidth)
                                .attr('marker-end', marker);

                            // Add edge label (signal name)
                            if (edge.label) {
                                edgeGroup.append('text')
                                    .attr('x', midX)
                                    .attr('y', midY - 10)
                                    .attr('text-anchor', 'middle')
                                    .attr('class', 'd3-edge-label')
                                    .attr('font-size', '9px')
                                    .text(edge.label)
                                    .style('pointer-events', 'none');
                            }

                            // Add width label for buses
                            if (isBus && edge.properties?.widthLabel) {
                                edgeGroup.append('text')
                                    .attr('x', midX)
                                    .attr('y', midY + 10)
                                    .attr('text-anchor', 'middle')
                                    .attr('class', 'd3-width-label')
                                    .attr('font-size', '9px')
                                    .text(edge.properties.widthLabel)
                                    .style('pointer-events', 'none');
                            }
                        }
                    });
                }

                // Track zoom level for responsive sizing
                let currentZoom = 1;

                // Add zoom and pan
                const zoom = d3.zoom()
                    .on('zoom', (event) => {
                        g.attr('transform', event.transform);
                        currentZoom = event.transform.k;
                        updateZoomResponsiveStyles(event.transform.k);
                    });

                svg.call(zoom);

                // Update responsive styles based on zoom
                function updateZoomResponsiveStyles(zoomLevel) {
                    // Scale label font sizes based on zoom
                    const baseFontSize = 11;
                    const portFontSize = 10;
                    const scaledFontSize = Math.max(8, baseFontSize / zoomLevel);
                    const scaledPortFontSize = Math.max(7, portFontSize / zoomLevel);
                    const scaledBlockLabelSize = Math.max(10, 14 / zoomLevel);

                    g.selectAll('.d3-label')
                        .style('font-size', scaledFontSize + 'px');

                    g.selectAll('.d3-edge-label, .d3-width-label')
                        .style('font-size', scaledFontSize + 'px');

                    // Adjust port sizes based on zoom
                    const portRadius = Math.max(2, 4 / zoomLevel);
                    g.selectAll('circle[data-port-id]')
                        .attr('r', portRadius);
                }

                // Pan interaction with mouse
                let isPanning = false;
                let panStartX = 0;
                let panStartY = 0;
                let currentTransform = d3.zoomIdentity;

                svg.on('mousedown', () => {
                    isPanning = true;
                    [panStartX, panStartY] = d3.mouse(svg.node());
                })
                .on('mousemove', () => {
                    if (!isPanning) return;
                    const [x, y] = d3.mouse(svg.node());
                    const dx = x - panStartX;
                    const dy = y - panStartY;
                    currentTransform = currentTransform.translate(dx, dy);
                    g.attr('transform', currentTransform);
                })
                .on('mouseup', () => {
                    isPanning = false;
                })
                .on('mouseleave', () => {
                    isPanning = false;
                });

                // Wheel zoom
                svg.on('wheel', function(event) {
                    event.preventDefault();
                    const direction = event.deltaY > 0 ? 0.9 : 1.1;
                    const [x, y] = d3.mouse(this);
                    const newTransform = currentTransform.translate(x, y)
                        .scale(currentTransform.k * direction)
                        .translate(-x, -y);
                    currentTransform = newTransform;
                    g.attr('transform', newTransform);
                }, { passive: false });

                svgRef.current = svg;
                zoomRef.current = zoom;
            };

            const handleRender = async () => {
                if (!code.trim()) {
                    setError('Please enter some SystemVerilog code');
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);
                setStats(null);

                try {
                    const response = await fetch('/api/full-pipeline', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code })
                    });

                    const data = await response.json();

                    if (!data.success) {
                        setError(data.error || 'Failed to render diagram');
                        setResult(null);
                    } else {
                        setResult(data);
                        setStats({
                            parseTime: data.stages.parse?.duration || 0,
                            typeDetection: data.stages.typeDetection?.duration || 0,
                            transform: data.stages.transform?.duration || 0,
                            layout: data.stages.layout?.duration || 0,
                            total: data.stages.total || 0
                        });

                        // Render first graph
                        if (data.layoutedGraphs && data.layoutedGraphs.length > 0) {
                            setTimeout(() => {
                                renderD3Diagram(data.layoutedGraphs[0]);
                            }, 100);
                        }
                    }
                } catch (err) {
                    setError(`Network error: ${err.message}`);
                    setResult(null);
                } finally {
                    setLoading(false);
                }
            };

            const handleClear = () => {
                setCode('');
                setResult(null);
                setError(null);
                setStats(null);
            };

            const handleExportSVG = () => {
                if (!svgRef.current) return;

                const svgElement = d3ContainerRef.current?.querySelector('svg');
                if (!svgElement) return;

                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(svgElement);
                const blob = new Blob([svgString], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'diagram.svg';
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="container">
                    <div className="editor-pane">
                        <div className="header">
                            <div>
                                <h1>🔧 SchemaTeX Prototype Tester</h1>
                                <p>Paste SystemVerilog → See interactive diagram</p>
                            </div>
                        </div>

                        <div className="pane-header">
                            <h2>SystemVerilog Input</h2>
                        </div>

                        <div style={{ padding: '12px 16px', borderBottom: '1px solid #e0e0e0', display: 'flex', gap: '12px', alignItems: 'center' }}>
                            <label style={{ fontWeight: '600', whiteSpace: 'nowrap' }}>Load Example:</label>
                            <select
                                value={selectedExample}
                                onChange={(e) => handleExampleChange(e.target.value)}
                                style={{
                                    flex: 1,
                                    padding: '6px 10px',
                                    borderRadius: '4px',
                                    border: '1px solid #e0e0e0',
                                    fontSize: '12px',
                                    fontFamily: 'inherit',
                                    cursor: 'pointer'
                                }}
                            >
                                {Object.entries(examples).map(([key, example]) => (
                                    <option key={key} value={key}>
                                        {example.name}
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div className="editor-area">
                            <textarea
                                value={code}
                                onChange={(e) => setCode(e.target.value)}
                                placeholder="Paste SystemVerilog code here..."
                                id="code-textarea"
                            />
                        </div>

                        <div className="button-group">
                            <button className="primary" onClick={handleRender} disabled={loading} id="render-btn">
                                {loading ? (
                                    <>
                                        <span className="spinner"></span>
                                        Rendering...
                                    </>
                                ) : (
                                    '▶ Render'
                                )}
                            </button>
                            <button className="secondary" onClick={handleClear}>Clear</button>
                            <button className="secondary" onClick={handleExportSVG} disabled={!result}>Export SVG</button>
                        </div>
                    </div>

                    <div className="output-pane">
                        <div className="header" style={{ flex: 0 }}>
                            <div>
                                <h1>📊 Interactive Diagram</h1>
                                <p>{result ? '✅ Rendering complete' : 'Click "Render" to generate diagram'}</p>
                            </div>
                        </div>

                        {error && (
                            <div className="error-banner">
                                <strong>❌ Error:</strong> {error}
                            </div>
                        )}

                        {stats && (
                            <div className="stats-bar">
                                <div className="stats-item"><strong>Parse:</strong> {stats.parseTime}ms</div>
                                <div className="stats-item"><strong>Types:</strong> {stats.typeDetection}ms</div>
                                <div className="stats-item"><strong>Transform:</strong> {stats.transform}ms</div>
                                <div className="stats-item"><strong>Layout:</strong> {stats.layout}ms</div>
                                <div className="stats-item"><strong>Total:</strong> {stats.total}ms</div>
                            </div>
                        )}

                        {result && (
                            <div className="tabs">
                                <button
                                    className={`tab ${activeTab === 'diagram' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('diagram')}
                                >
                                    Diagram
                                </button>
                                <button
                                    className={`tab ${activeTab === 'json' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('json')}
                                >
                                    JSON AST
                                </button>
                                <button
                                    className={`tab ${activeTab === 'info' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('info')}
                                >
                                    Info
                                </button>
                            </div>
                        )}

                        <div className="content">
                            {loading ? (
                                <div className="loading">
                                    <span className="spinner"></span>
                                    Processing pipeline: Parse → Detect Types → Transform → Layout → Render
                                </div>
                            ) : result ? (
                                activeTab === 'diagram' ? (
                                    <div className="diagram-container" id="d3-canvas" ref={d3ContainerRef}>
                                        <div className="zoom-controls">
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.scaleBy, 1.3);
                                                }
                                            }}>+</button>
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.scaleBy, 0.77);
                                                }
                                            }}>−</button>
                                            <button onClick={() => {
                                                if (zoomRef.current && svgRef.current) {
                                                    svgRef.current.transition().duration(750)
                                                        .call(zoomRef.current.transform, d3.zoomIdentity.translate(50, 50));
                                                }
                                            }}>⟲</button>
                                        </div>
                                    </div>
                                ) : activeTab === 'json' ? (
                                    <div className="json-output">
                                        {JSON.stringify(result.parseResult, null, 2)}
                                    </div>
                                ) : (
                                    <div className="json-output">
                                        <strong>Pipeline Stages:</strong>
                                        {JSON.stringify(result.stages, null, 2)}
                                        {'\n\n'}
                                        <strong>Block Types Detected:</strong>
                                        {JSON.stringify(result.blockTypes, null, 2)}
                                        {'\n\n'}
                                        <strong>Module Count:</strong> {result.parseResult?.modules?.length || 0}
                                    </div>
                                )
                            ) : (
                                <div className="empty">👈 Enter SystemVerilog code and click "Render" to see the diagram</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
